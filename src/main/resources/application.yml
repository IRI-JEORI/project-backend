spring:
  application:
    name: nunnun
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}

aws:
  s3:
    enabled: ${AWS_S3_ENABLED:false}
    region: ${AWS_REGION:}
    bucket: ${AWS_S3_BUCKET:}
    wake-proof-cleanup-fixed-delay-ms: ${WAKE_PROOF_CLEANUP_FIXED_DELAY_MS:300000}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:}

notification:
  dispatcher-fixed-delay-ms: ${NOTIFICATION_DISPATCHER_FIXED_DELAY_MS:30000}
  dispatcher-initial-delay-ms: ${NOTIFICATION_DISPATCHER_INITIAL_DELAY_MS:30000}
